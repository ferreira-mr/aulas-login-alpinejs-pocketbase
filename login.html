<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login dos alunos</title>
    <link rel="stylesheet" href="css/estilo.css" />
    <!-- Primeiro vem nossa função; depois o Alpine lê x-data. -->
    <script defer src="js/login.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.4/dist/cdn.min.js"></script>
  </head>
  <body>
    <!-- x-data cria o estado desta parte da página. -->
    <main class="cartao" x-data="formulario()" x-cloak>
      <h1>Entrar</h1>
      <p>Digite um e-mail e veja o texto mudar enquanto escreve.</p>

      <label for="email">E-mail</label>
      <!-- x-model guarda o valor digitado na variável email. -->
      <input id="email" type="email" x-model="email" placeholder="aluno@escola.com" />

      <!-- x-text mostra o valor da variável, sem enviar nada ao servidor. -->
      <p x-show="email">E-mail digitado: <strong x-text="email"></strong></p>

      <label for="senha">Senha</label>
      <input id="senha" type="password" placeholder="Sua senha" />
      <button type="button" disabled>Entrar (na próxima etapa)</button>

      <p><a href="logado.html">Conhecer a segunda página</a></p>
    </main>
  </body>
</html>
