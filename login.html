<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login dos alunos</title>
    <link rel="stylesheet" href="css/estilo.css" />
    <!-- O SDK, a configuração e nossa função precisam existir antes de Alpine iniciar. -->
    <script defer src="https://cdn.jsdelivr.net/npm/pocketbase@0.28.1/dist/pocketbase.umd.js"></script>
    <script defer src="js/pocketbase.js"></script>
    <script defer src="js/login.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.4/dist/cdn.min.js"></script>
  </head>
  <body>
    <main class="cartao" x-data="loginComPocketBase()" x-cloak>
      <h1>Entrar</h1>
      <p>Agora o PocketBase confere e-mail e senha.</p>

      <!-- prevent impede que o navegador recarregue a página ao enviar. -->
      <form @submit.prevent="entrar">
        <label for="email">E-mail</label>
        <input id="email" type="email" x-model="email" autocomplete="username" required />

        <label for="senha">Senha</label>
        <input id="senha" type="password" x-model="senha" autocomplete="current-password" required />

        <p class="mensagem-erro" x-show="erro" x-text="erro" role="alert"></p>
        <button type="submit" :disabled="carregando">
          <span x-text="carregando ? 'Entrando...' : 'Entrar'"></span>
        </button>
      </form>
    </main>
  </body>
</html>
