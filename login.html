<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Etapa 3 - Login com PocketBase</title>
    <style>
      [x-cloak] { display: none !important; }
      body { max-width: 420px; margin: 60px auto; padding: 0 20px; font-family: Arial, sans-serif; }
      label { display: block; margin-top: 16px; }
      input { width: 100%; padding: 10px; box-sizing: border-box; }
      button { margin-top: 20px; padding: 10px 16px; color: white; background: #2563eb; border: 0; cursor: pointer; }
      .erro { color: #b91c1c; }
    </style>
    <!-- O SDK cria um cliente JavaScript para conversar com o PocketBase. -->
    <script src="https://cdn.jsdelivr.net/npm/pocketbase@0.28.1/dist/pocketbase.umd.js"></script>
    <script>
      // Este endereço aponta para o PocketBase rodando no próprio computador.
      window.pb = new PocketBase('http://127.0.0.1:8090');
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.4/dist/cdn.min.js"></script>
  </head>
  <body>
    <main x-data="loginComPocketBase()" x-cloak>
      <h1>Entrar</h1>
      <p>Etapa 3: agora o PocketBase confere as credenciais.</p>

      <form @submit.prevent="entrar">
        <label for="email">E-mail</label>
        <input id="email" type="email" x-model="email" required />

        <label for="senha">Senha</label>
        <input id="senha" type="password" x-model="senha" required />

        <p class="erro" x-show="erro" x-text="erro" role="alert"></p>
        <button type="submit" :disabled="carregando">
          <span x-text="carregando ? 'Entrando...' : 'Entrar'"></span>
        </button>
      </form>
    </main>

    <script>
      function loginComPocketBase() {
        return {
          email: '',
          senha: '',
          erro: '',
          carregando: false,

          async entrar() {
            this.erro = '';
            this.carregando = true;

            try {
              // authWithPassword envia e-mail e senha para a coleção Auth users.
              await window.pb.collection('users').authWithPassword(this.email, this.senha);

              // O SDK guarda o token localmente, para a próxima página poder usá-lo.
              window.location.href = 'logado.html';
            } catch (erro) {
              this.erro = 'Não foi possível entrar. Confira as credenciais e o PocketBase.';
            } finally {
              this.carregando = false;
            }
          },
        };
      }
    </script>
  </body>
</html>
