<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login dos alunos</title>
    <link rel="stylesheet" href="css/estilo.css" />

    <!-- Carregamos os scripts em ordem: SDK, configuração, componente e Alpine. -->
    <script defer src="https://cdn.jsdelivr.net/npm/pocketbase@0.28.1/dist/pocketbase.umd.js"></script>
    <script defer src="js/pocketbase.js"></script>
    <script defer src="js/login.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.4/dist/cdn.min.js"></script>
  </head>
  <body>
    <!-- O nome loginApp conecta este HTML ao componente definido em js/login.js. -->
    <main class="cartao" x-data="loginApp" x-cloak>
      <h1>Entrar</h1>
      <p>Use seu e-mail e sua senha para acessar.</p>

      <!-- @submit.prevent chama entrar sem recarregar esta página. -->
      <form @submit.prevent="entrar">
        <label for="email">E-mail</label>
        <!-- x-model mantém o valor do campo na variável email do Alpine. -->
        <input
          id="email"
          type="email"
          x-model="email"
          autocomplete="username"
          required
        />

        <label for="senha">Senha</label>
        <input
          id="senha"
          type="password"
          x-model="senha"
          autocomplete="current-password"
          required
        />

        <!-- A mensagem só aparece quando a variável erro contém texto. -->
        <p class="mensagem-erro" x-show="erro" x-text="erro" role="alert"></p>
        <button type="submit" :disabled="carregando">
          <span x-text="carregando ? 'Entrando...' : 'Entrar'"></span>
        </button>
      </form>
    </main>
  </body>
</html>
