<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Área do aluno</title>
    <link rel="stylesheet" href="css/estilo.css" />

    <!-- Use a mesma ordem de scripts da página de login. -->
    <script defer src="https://cdn.jsdelivr.net/npm/pocketbase@0.28.1/dist/pocketbase.umd.js"></script>
    <script defer src="js/pocketbase.js"></script>
    <script defer src="js/logado.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.4/dist/cdn.min.js"></script>
  </head>
  <body>
    <!-- O componente valida o login antes de mostrar o conteúdo. -->
    <main class="cartao" x-data="paginaLogado" x-cloak>
      <h1>Área do aluno</h1>
      <div class="boas-vindas">
        <p>Você entrou com:</p>
        <strong x-text="usuario && usuario.email"></strong>
      </div>
      <p>Este é o conteúdo disponível depois do login.</p>
      <button class="botao-secundario" type="button" @click="sair">Sair</button>
    </main>
  </body>
</html>
