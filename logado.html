<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Área do aluno</title>
    <link rel="stylesheet" href="css/estilo.css" />

    <!-- Mesma ordem da página de login: SDK, configuração, página e Alpine. -->
    <script defer src="https://cdn.jsdelivr.net/npm/pocketbase@0.28.1/dist/pocketbase.umd.js"></script>
    <script defer src="js/pocketbase.js"></script>
    <script defer src="js/logado.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.4/dist/cdn.min.js"></script>
  </head>
  <body>
    <!-- A função paginaLogada vem de js/logado.js. -->
    <main class="cartao" x-data="paginaLogada()" x-cloak>
      <p x-show="verificando" role="status">Verificando login...</p>

      <!-- O conteúdo só aparece após a resposta do PocketBase. -->
      <section x-show="usuario">
        <h1>Área do aluno</h1>
        <div class="boas-vindas">
          <p>Você entrou com:</p>
          <strong x-text="usuario && usuario.email"></strong>
        </div>
        <p>O PocketBase confirmou este login.</p>
        <button class="botao-secundario" type="button" @click="sair">Sair</button>
      </section>
    </main>
  </body>
</html>
